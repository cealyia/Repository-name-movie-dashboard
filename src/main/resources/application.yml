server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: movie-dashboard
  # 数据库账号密码放在 application-local.yml（已加入 .gitignore），不提交到仓库
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_dashboard}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ctgu.movie.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    # 调试 SQL 时把下面一行换成 org.apache.ibatis.logging.stdout.StdOutImpl，
    # 控制台会打印每条 SQL 和参数；演示时保持关闭，避免刷屏。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
    com.ctgu.movie: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
